# 国内 AI / 科技信息源
#
# tier 分级（决定基础分，直接影响排序，见 tier_base_score）：
#   1 = AI 垂类媒体、厂商官方一手源
#   2 = 科技媒体（AI 内容占比中等）
#   3 = 泛科技聚合（量大、噪音多，基础分故意低于默认 15，避免淹没观点类内容）
#
# filter_mode：
#   loose  = 不过滤（源本身是 AI 垂类时使用）
#   strict = 标题或摘要必须命中 ai_keywords 才收录（泛科技源必须用）
#
# enabled: false 可单独关停失效源，不影响其他源。
# 实测记录见 docs/zh-sources.md。

defaults:
  filter_mode: strict
  filter_scope: title            # 只按标题判定是否 AI 相关：摘要太长，常顺带提一句 AI 导致误收
  summary_chars: 600             # 国内源摘要常是全文，截断以控制 LLM 输入长度
  max_items_per_source: 8        # 每源最多收录条数，防止 IT之家 这类大源灌爆
  max_per_source_in_result: 4    # 排序后每源最多保留条数，保证日报来源多样性
  max_total_items: 90            # 预处理后全局上限，控制 LLM 输入长度
  # 语言配额（全局策略，同样作用于海外源）：先按比例预留坑位，再按分数补位。
  # 不设则纯按分数排序 —— 国内源数量多，会把海外内容挤没。
  lang_quota:
    zh: 0.6
    en: 0.4
  # 来源类型配额：X 推文条数多且互动量高，不设上限会把新闻稿挤下去。
  max_type_ratio:
    twitter: 0.3

tier_base_score:
  1: 25
  2: 18
  3: 10

# 国内源关键词白名单。ASCII 词按词边界匹配（"AI" 不会命中 "email"/"said"），
# 中文词按子串匹配。
